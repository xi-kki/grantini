<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grantini — Free Grant Research Bot</title>
  <meta name="description" content="Paste any project URL or description and get a full grant funding report in seconds. Free, powered by Groq." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0f;
      --surface:   #16161a;
      --card:      #1c1c22;
      --border:    #2a2a35;
      --text:      #e8e8f0;
      --muted:     #8888a0;
      --primary:   #7c6af7;
      --primary-h: #9b8dff;
      --green:     #22c55e;
      --yellow:    #eab308;
      --red:       #ef4444;
      --radius:    12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.65;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

    /* ── Header ── */
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    .logo { display: flex; align-items: center; gap: .75rem; }
    .logo-icon { font-size: 2rem; line-height: 1; }
    .logo h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; }
    .logo p  { font-size: .85rem; color: var(--muted); margin-top: .1rem; }
    .badge { font-size: .72rem; font-weight: 600; padding: .2rem .6rem; border-radius: 99px; background: rgba(34,197,94,.15); color: var(--green); border: 1px solid rgba(34,197,94,.3); white-space: nowrap; }
    .gh-link { font-size: .8rem; color: var(--muted); text-decoration: none; border: 1px solid var(--border); padding: .35rem .75rem; border-radius: 8px; transition: color .2s, border-color .2s; white-space: nowrap; }
    .gh-link:hover { color: var(--text); border-color: var(--muted); }

    /* ── Card ── */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.25rem; }
    .card-title { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 1rem; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
    .tab { font-size: .85rem; font-weight: 500; padding: .4rem .9rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .2s; }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* ── Inputs ── */
    label { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .4rem; }
    input[type=text], input[type=url], textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: .65rem .9rem; font-size: .9rem; color: var(--text); transition: border-color .2s;
      font-family: inherit; resize: none;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    .field { margin-bottom: 1rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── Run Button ── */
    .btn-run {
      width: 100%; padding: .85rem; font-size: .95rem; font-weight: 700;
      background: var(--primary); color: #fff; border: none; border-radius: 10px;
      cursor: pointer; transition: opacity .2s, transform .1s; margin-top: .25rem;
    }
    .btn-run:hover:not(:disabled) { opacity: .9; }
    .btn-run:active:not(:disabled) { transform: scale(.98); }
    .btn-run:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Pipeline Steps ── */
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1rem; }
    @media (max-width: 600px) { .steps { grid-template-columns: repeat(2, 1fr); } }
    .step {
      background: var(--card); border: 2px solid var(--border); border-radius: var(--radius);
      padding: 1rem .85rem; transition: border-color .3s;
    }
    .step.active { border-color: var(--primary); }
    .step.done   { border-color: var(--green); }
    .step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
    .step-icon { font-size: 1.25rem; }
    .step-check { color: var(--green); font-weight: 700; font-size: .9rem; }
    .step-spinner {
      width: 16px; height: 16px; border: 2px solid var(--primary); border-top-color: transparent;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    .step-dot { width: 16px; height: 16px; border: 2px solid var(--border); border-radius: 50%; }
    .step-label { font-size: .85rem; font-weight: 600; }
    .step-desc  { font-size: .75rem; color: var(--muted); margin-top: .2rem; }

    /* ── Log ── */
    .log {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: .85rem 1rem; height: 130px; overflow-y: auto; font-family: 'Fira Mono', 'Courier New', monospace;
      font-size: .78rem; line-height: 1.7;
    }
    .log-info    { color: var(--muted); }
    .log-step    { color: var(--primary); }
    .log-success { color: var(--green); }
    .log-error   { color: var(--red); }

    /* ── Streaming output ── */
    #streamWrap { display: none; }
    .stream-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.5rem; font-size: .88rem; line-height: 1.75; color: var(--text);
      min-height: 200px; white-space: pre-wrap; word-break: break-word;
    }
    .cursor { display: inline-block; width: 2px; height: 1em; background: var(--primary); margin-left: 1px; animation: blink .8s steps(1) infinite; vertical-align: text-bottom; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Rendered report ── */
    #reportWrap { display: none; }
    .report {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.75rem; font-size: .9rem; line-height: 1.8;
    }
    .report h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: .5rem; }
    .report h2 { font-size: 1.1rem; font-weight: 700; margin: 1.75rem 0 .6rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
    .report h3 { font-size: .95rem; font-weight: 600; margin: 1.1rem 0 .35rem; color: var(--primary-h); }
    .report p  { margin-bottom: .75rem; }
    .report ul, .report ol { padding-left: 1.5rem; margin-bottom: .75rem; }
    .report li { margin-bottom: .3rem; }
    .report strong { font-weight: 700; color: #fff; }
    .report em { color: var(--muted); font-style: italic; }
    .report hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .report code { background: rgba(124,106,247,.15); color: var(--primary-h); padding: .1rem .35rem; border-radius: 4px; font-family: 'Fira Mono', monospace; font-size: .82rem; }
    .report pre  { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; margin-bottom: 1rem; }
    .report pre code { background: none; padding: 0; }
    .report table { width: 100%; border-collapse: collapse; margin-bottom: 1.25rem; font-size: .83rem; overflow-x: auto; display: block; }
    .report th { background: var(--surface); color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; padding: .55rem .75rem; text-align: left; border: 1px solid var(--border); }
    .report td { padding: .55rem .75rem; border: 1px solid var(--border); vertical-align: top; }
    .report tr:hover td { background: rgba(255,255,255,.025); }
    .report blockquote { border-left: 3px solid var(--primary); padding-left: 1rem; margin: 1rem 0; color: var(--muted); font-style: italic; }

    /* ── Export buttons ── */
    .export-row { display: flex; gap: .75rem; margin-top: 1rem; }
    .btn-sec {
      flex: 1; padding: .7rem; font-size: .88rem; font-weight: 600;
      border: 1px solid var(--border); background: transparent; color: var(--text);
      border-radius: 10px; cursor: pointer; transition: background .2s;
    }
    .btn-sec:hover { background: var(--surface); }
    .btn-pri {
      flex: 1; padding: .7rem; font-size: .88rem; font-weight: 600;
      background: var(--primary); color: #fff; border: none;
      border-radius: 10px; cursor: pointer; transition: opacity .2s;
    }
    .btn-pri:hover { opacity: .9; }

    /* ── Footer ── */
    footer { text-align: center; font-size: .78rem; color: var(--muted); margin-top: 3rem; }
    footer a { color: var(--primary-h); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Animations ── */
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeUp  { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp .35s ease both; }

    /* ── Hidden ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <header class="fade-up">
    <div class="logo">
      <div class="logo-icon">💰</div>
      <div>
        <h1>Grantini</h1>
        <p>Free agentic grant research &nbsp;·&nbsp; powered by <strong>Groq</strong></p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:.6rem;flex-shrink:0">
      <span class="badge">Free</span>
      <a href="https://github.com/xi-kki/grantini" target="_blank" class="gh-link">GitHub ↗</a>
    </div>
  </header>

  <!-- Input card -->
  <div class="card fade-up" id="inputCard">
    <div class="card-title">Your Project</div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="setTab('url')"  id="tabUrl">🌐 URL</button>
      <button class="tab"        onclick="setTab('desc')" id="tabDesc">📝 Description</button>
      <button class="tab"        onclick="setTab('both')" id="tabBoth">Both</button>
    </div>

    <div id="urlField" class="field">
      <label>Project website URL</label>
      <input type="url" id="projectUrl" placeholder="https://yourproject.com" value="https://kraiiv.xyz" />
    </div>

    <div id="descField" class="field hidden">
      <label>Project description</label>
      <textarea id="projectDesc" rows="5"
        placeholder="Describe your project — what it does, who it helps, where you're based, your stage, any traction…"></textarea>
    </div>

    <button class="btn-run" id="runBtn" onclick="run()">🚀 Research Grants</button>
  </div>

  <!-- Pipeline -->
  <div id="pipelineCard" class="card hidden fade-up">
    <div class="card-title">Pipeline</div>
    <div class="steps" id="steps"></div>
    <div class="log" id="logBox"></div>
  </div>

  <!-- Streaming (live typewriter) -->
  <div id="streamWrap" class="card fade-up">
    <div class="card-title">Generating report…</div>
    <div class="stream-box" id="streamBox"><span class="cursor"></span></div>
  </div>

  <!-- Final rendered report -->
  <div id="reportWrap" class="fade-up">
    <div class="card">
      <div class="card-title">Funding Report</div>
      <div class="report" id="reportBox"></div>
    </div>
    <div class="export-row">
      <button class="btn-sec" onclick="copyReport()">📋 Copy Report</button>
      <button class="btn-pri" onclick="downloadReport()">⬇️ Download .md</button>
    </div>
    <p style="text-align:center;font-size:.78rem;color:var(--muted);margin-top:.75rem">
      Run locally for CLI mode:
      <code style="background:rgba(124,106,247,.15);color:#9b8dff;padding:.1rem .4rem;border-radius:4px">python main.py --url https://yourproject.com</code>
    </p>
  </div>

  <footer>
    <p>Grantini is free &amp; open source ·
      <a href="https://github.com/xi-kki/grantini">github.com/xi-kki/grantini</a>
      &nbsp;·&nbsp; Powered by <a href="https://groq.com">Groq</a>
    </p>
  </footer>

</div>

<script>
// ── State ────────────────────────────────────────────────────────────
let tab       = 'url';
let rawReport = '';
let running   = false;

// ── Tabs ─────────────────────────────────────────────────────────────
function setTab(t) {
  tab = t;
  ['url','desc','both'].forEach(id => {
    document.getElementById('tab' + id[0].toUpperCase() + id.slice(1)).classList.toggle('active', id === t);
  });
  document.getElementById('urlField').classList.toggle('hidden',  t === 'desc');
  document.getElementById('descField').classList.toggle('hidden', t === 'url');
}

// ── Steps ─────────────────────────────────────────────────────────────
const STEPS = [
  { id:'fetch',    icon:'🌐', label:'Fetch',     desc:'Load project'      },
  { id:'analyse',  icon:'🔍', label:'Analyse',   desc:'Profile project'   },
  { id:'research', icon:'🌍', label:'Research',  desc:'Find grants'       },
  { id:'write',    icon:'📝', label:'Write',     desc:'Generate report'   },
];

function renderSteps(activeId=null, doneIds=[]) {
  document.getElementById('steps').innerHTML = STEPS.map((s,i) => {
    const done   = doneIds.includes(s.id);
    const active = s.id === activeId;
    return `<div class="step ${done?'done':active?'active':''}">
      <div class="step-head">
        <span class="step-icon">${s.icon}</span>
        ${done   ? '<span class="step-check">✓</span>'
          :active? '<div class="step-spinner"></div>'
          :         '<div class="step-dot"></div>'}
      </div>
      <div class="step-label">${i+1}. ${s.label}</div>
      <div class="step-desc">${s.desc}</div>
    </div>`;
  }).join('');
}

// ── Log ───────────────────────────────────────────────────────────────
function log(msg, type='info') {
  const box = document.getElementById('logBox');
  const el  = document.createElement('div');
  el.className = 'log-' + type;
  el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

// ── Main run ──────────────────────────────────────────────────────────
async function run() {
  if (running) return;
  running = true;

  const url  = document.getElementById('projectUrl').value.trim();
  const desc = document.getElementById('projectDesc').value.trim();

  if (!url && !desc) {
    alert('Please enter a project URL or description.');
    running = false;
    return;
  }

  // Reset UI
  rawReport = '';
  document.getElementById('runBtn').disabled = true;
  document.getElementById('runBtn').textContent = '⏳ Researching…';
  document.getElementById('pipelineCard').classList.remove('hidden');
  document.getElementById('streamWrap').style.display = 'none';
  document.getElementById('reportWrap').style.display = 'none';
  document.getElementById('streamBox').innerHTML = '<span class="cursor"></span>';
  document.getElementById('logBox').innerHTML = '';

  const done = [];
  renderSteps(null, done);

  // Step 1: Fetch
  renderSteps('fetch', done);
  log('Fetching project content…', 'step');
  await sleep(400);

  // Step 2: Analyse  
  done.push('fetch');
  renderSteps('analyse', done);
  log('Analysing project profile…', 'step');
  await sleep(300);

  // Step 3: Research
  done.push('analyse');
  renderSteps('research', done);
  log('Searching 20+ grant programs…', 'step');

  // Step 4: Write (stream)
  done.push('research');
  renderSteps('write', done);
  log('Generating report (streaming)…', 'step');

  // Show stream box
  document.getElementById('streamWrap').style.display = 'block';
  const streamBox = document.getElementById('streamBox');

  try {
    const body = {};
    if (tab !== 'desc' && url)  body.url         = url;
    if (tab !== 'url'  && desc) body.description = desc;
    if (tab === 'url'  && url)  body.url         = url;

    const resp = await fetch('/api/research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`API error ${resp.status}: ${errText}`);
    }

    // Read SSE stream
    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let   buffer  = '';

    while (true) {
      const { done: streamDone, value } = await reader.read();
      if (streamDone) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const parsed = JSON.parse(data);
          const token  = parsed.choices?.[0]?.delta?.content || '';
          if (token) {
            rawReport += token;
            // Show last 800 chars in stream box for performance
            const display = rawReport.slice(-1200);
            streamBox.textContent = (rawReport.length > 1200 ? '…' : '') + display;
            streamBox.scrollTop   = streamBox.scrollHeight;
          }
        } catch { /* incomplete JSON chunk */ }
      }
    }

    // Done
    done.push('write');
    renderSteps(null, done);
    log('✅ Report complete!', 'success');

    await sleep(400);
    document.getElementById('streamWrap').style.display = 'none';
    renderReport(rawReport);

  } catch (err) {
    log('❌ ' + err.message, 'error');
    console.error(err);
  }

  document.getElementById('runBtn').disabled    = false;
  document.getElementById('runBtn').textContent = '🔄 Research Again';
  running = false;
}

// ── Markdown → HTML renderer ──────────────────────────────────────────
function mdToHtml(md) {
  let html = md
    // Code blocks
    .replace(/```[\s\S]*?```/g, m => {
      const code = m.replace(/^```.*\n?/, '').replace(/```$/, '');
      return `<pre><code>${esc(code)}</code></pre>`;
    })
    // Inline code
    .replace(/`([^`]+)`/g, (_, c) => `<code>${esc(c)}</code>`)
    // H1-H3
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm,  '<h2>$1</h2>')
    .replace(/^# (.+)$/gm,   '<h1>$1</h1>')
    // HR
    .replace(/^---+$/gm, '<hr>')
    // Bold + italic
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,     '<strong>$1</strong>')
    .replace(/__(.+?)__/g,          '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,          '<em>$1</em>')
    // Tables
    .replace(/(\|[^\n]+\|\n)((?:\|[-: ]+\|\n))(\|[^\n]+\|\n?)+/g, m => {
      const rows = m.trim().split('\n').filter(Boolean);
      const head = rows[0].split('|').filter(Boolean).map(c => `<th>${c.trim()}</th>`).join('');
      const body = rows.slice(2).map(r =>
        '<tr>' + r.split('|').filter(Boolean).map(c => `<td>${c.trim()}</td>`).join('') + '</tr>'
      ).join('');
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    })
    // Blockquote
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // Unordered lists
    .replace(/(^[-*+] .+\n?)+/gm, m => {
      const items = m.trim().split('\n').map(l => `<li>${l.replace(/^[-*+] /,'')}</li>`).join('');
      return `<ul>${items}</ul>`;
    })
    // Ordered lists
    .replace(/(^\d+\. .+\n?)+/gm, m => {
      const items = m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /,'')}</li>`).join('');
      return `<ol>${items}</ol>`;
    })
    // Paragraphs
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/^(?!<[a-z])/gm, '<p>')
    .replace(/(?<![>])\n(?!<[a-z/])/g, '<br>');

  // Clean up orphan <p> tags
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(<(?:h[123]|ul|ol|table|pre|hr|blockquote))/g, '$1');
  html = html.replace(/(<\/(?:h[123]|ul|ol|table|pre|hr|blockquote)>)<\/p>/g, '$1');

  return html;
}

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderReport(md) {
  document.getElementById('reportBox').innerHTML = mdToHtml(md);
  document.getElementById('reportWrap').style.display = 'block';
  document.getElementById('reportWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Export ───────────────────────────────────────────────────────────
function copyReport() {
  navigator.clipboard.writeText(rawReport);
  const btn = event.target;
  btn.textContent = '✅ Copied!';
  setTimeout(() => btn.textContent = '📋 Copy Report', 2000);
}

function downloadReport() {
  const blob = new Blob([rawReport], { type: 'text/markdown' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `grantini-report-${new Date().toISOString().slice(0,10)}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Utils ────────────────────────────────────────────────────────────
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Init
renderSteps();
</script>
</body>
</html>
